      <p class="kicker">You are here</p>
      <h1>The Concourse</h1>
      <p class="exhibit-blurb">The terminal at the hour with no flights. Gates without end, escalators that only cross, a single suitcase going round. The walkway keeps moving. You are the only one it is moving.</p>
